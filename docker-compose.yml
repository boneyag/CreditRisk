services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: creditrisk:latest
    command: ["python", "-m", "creditrisk.main", "--model", "xgb"]
    environment:
      CREDITRISK_DATA_DIR: /app/data
      CREDITRISK_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: creditrisk:latest
    command: ["uvicorn", "creditrisk.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CREDITRISK_DATA_DIR: /app/data
      CREDITRISK_ARTIFACTS_DIR: /app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
