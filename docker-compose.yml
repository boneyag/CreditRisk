services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: creditrisk:latest
    entrypoint: ["python", "-m", "creditrisk.main"]
    command: ["--model", "xgb"]
    profiles: ["train"]
    environment:
      CREDITRISK_DATA_DIR: /app/data
      CREDITRISK_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: creditrisk:latest
    command: ["uvicorn", "creditrisk.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CREDITRISK_DATA_DIR: /app/data
      CREDITRISK_ARTIFACTS_DIR: /app/artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: creditrisk-ui:latest
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  frontend_node_modules:
